name: matrix pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  matrix-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Wirefit/wirefit
          ref: a13ee3532102515a4dd6ed36b3bdef86f97f26aa
          path: .wirefit/source
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .wirefit/source/go.mod
          cache-dependency-path: .wirefit/source/go.sum
      - uses: Wirefit/wirefit/actions/pages@a13ee3532102515a4dd6ed36b3bdef86f97f26aa
        with:
          contracts-repo: TieuLongHo/wirefit-contracts
          token: ${{ github.token }}
          version: a13ee3532102515a4dd6ed36b3bdef86f97f26aa
